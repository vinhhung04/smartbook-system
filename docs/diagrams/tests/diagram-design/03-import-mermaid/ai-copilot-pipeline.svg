<title id="ai-copilot-pipeline-title">Kiến trúc xử lý của Trợ lý AI (Copilot)</title>
<desc id="ai-copilot-pipeline-desc">Bốn giai đoạn của Copilot: hiểu câu hỏi và lập kế hoạch, thu thập bằng chứng, sinh và kiểm chứng câu trả lời, phản hồi và hành động có con người xác nhận; hai nhánh LLM chỉ bật bằng cờ.</desc>
<defs>
      <style>#ai-copilot-pipeline-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #ai-copilot-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ai-copilot-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #ai-copilot-pipeline-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#ai-copilot-pipeline-root .diagram-container { overflow-x: visible; }
}</style>
