<text x="174.0" y="127" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="middle">1. Chọn nhân viên</text>
<text x="174.0" y="143" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="middle">nhận hàng cho</text>
