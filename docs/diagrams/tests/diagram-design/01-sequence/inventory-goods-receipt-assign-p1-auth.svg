<text x="200.0" y="255" fill="#1f3864" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="start">PATCH /api/goods-receipts/:id/assign</text>
<text x="200.0" y="271" fill="#1f3864" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="start">{received_by_user_id} + Bearer JWT</text>
<rect x="468" y="360" width="168" height="44" rx="4" fill="#f3f6fa" stroke="#c5cedb" stroke-width="1"/>
<text x="478.0" y="379" fill="#1f3864" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="start">authenticateToken:</text>
<text x="478.0" y="395" fill="#1f3864" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="start">jwt.verify(JWT_SECRET)</text>
<rect x="420" y="524" width="264" height="124" rx="4" fill="#f3f6fa" stroke="#c5cedb" stroke-width="1"/>
<text x="430.0" y="543" fill="#1f3864" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="start">enforceRequestedWarehouseScope:</text>
<text x="430.0" y="559" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start">body không có warehouse_id nên bỏ qua</text>
<text x="430.0" y="575" fill="#1f3864" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="start">rejectInvalidUuidParams(:id)</text>
<text x="430.0" y="591" fill="#1f3864" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="start">authorizeManagerDecision:</text>
<text x="430.0" y="607" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start">WAREHOUSE_MANAGER hoặc ADMIN</text>
<text x="430.0" y="623" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start">+ quyền inventory.operation.decide</text>
<text x="430.0" y="639" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start">(superuser bỏ qua)</text>
<rect x="212" y="792" width="376" height="76" rx="4" fill="#f3f6fa" stroke="#c5cedb" stroke-width="1"/>
<text x="222.0" y="811" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start">401 thiếu/sai header, token bị thu hồi</text>
<text x="222.0" y="827" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start">403 token hết hạn/không hợp lệ, thiếu vai trò/quyền</text>
<text x="222.0" y="843" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start">400 :id không phải UUID</text>
<text x="222.0" y="859" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start">503 chưa xác minh được phiên (Redis) với thao tác ghi</text>
<rect x="472" y="920" width="160" height="44" rx="4" fill="#f3f6fa" stroke="#c5cedb" stroke-width="1"/>
<text x="482.0" y="939" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start">Tiếp tục ở Phần 2:</text>
<text x="482.0" y="955" fill="#1f3864" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="start">assignGoodsReceipt</text>
