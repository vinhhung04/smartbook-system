<title id="goods-receipt-assign-p1-title">Phân công nhập kho, phần 1: xác thực và phân quyền</title>
<desc id="goods-receipt-assign-p1-desc">Quản lý kho gửi yêu cầu phân công phiếu nhập; API Gateway chuyển tiếp, Inventory Service xác minh JWT, kiểm tra thu hồi trên Redis, UUID và vai trò/quyền, trả lỗi hoặc chuyển sang controller.</desc>
