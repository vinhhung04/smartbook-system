<text x="476.0" y="303" fill="#2f5597" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="middle">3. Chuyển tiếp</text>
<text x="476.0" y="319" fill="#2f5597" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="middle">/api/* (proxy,</text>
<text x="476.0" y="335" fill="#2f5597" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="middle">không kiểm tra JWT)</text>
