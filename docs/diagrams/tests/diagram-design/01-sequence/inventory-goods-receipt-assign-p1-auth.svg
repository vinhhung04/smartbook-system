<text x="628.0" y="427" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="middle">4. Kiểm tra token</text>
<text x="628.0" y="443" fill="#1f3864" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="middle">bị thu hồi</text>
<text x="628.0" y="459" fill="#1f3864" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="middle">(revocation.check)</text>
