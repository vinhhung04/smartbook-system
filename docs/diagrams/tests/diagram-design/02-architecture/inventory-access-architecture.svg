<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 784" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inventory-access-architecture-title inventory-access-architecture-desc" id="inventory-access-architecture-root">
<title id="inventory-access-architecture-title">Kiến trúc kiểm soát truy cập kho</title>
<desc id="inventory-access-architecture-desc">Web App gọi API Gateway; Gateway chuyển /auth, /iam tới Auth Service và /api/* tới Inventory Service; Inventory kiểm tra phạm vi kho qua Auth Service, hai dịch vụ dùng Redis cho token thu hồi và cơ sở dữ liệu riêng trong cùng container PostgreSQL.</desc>
<defs>
      <style>#inventory-access-architecture-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #inventory-access-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #inventory-access-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #inventory-access-architecture-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#inventory-access-architecture-root .diagram-container { overflow-x: visible; }
}</style>
