<!-- callout -->
<text x="40" y="636" fill="#475569" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start" font-style="italic">① Inventory hỏi Auth Service phạm vi kho của người dùng trước mọi thao tác ghi theo kho:</text>
<text x="40" y="656" fill="#475569" font-size="12" font-family="Consolas, 'Courier New', ui-monospace, monospace" text-anchor="start">GET /internal/users/:id/warehouse-scopes · x-internal-service-key · cache 30 s</text>
<text x="40" y="676" fill="#475569" font-size="12" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="start" font-style="italic">Không lấy được phạm vi → từ chối yêu cầu (fail-closed), không bao giờ mở toàn bộ kho.</text>
