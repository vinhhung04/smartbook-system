  <!-- Diagram Design · profile: smartbook (Font source: system — không tải Google Fonts) -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      line-height: 1.25;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
    svg { width: 100%; min-width: 800px; max-width: 800px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
