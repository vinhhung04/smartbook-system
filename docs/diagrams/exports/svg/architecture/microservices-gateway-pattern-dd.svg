<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="microservices-gateway-pattern-dd-title microservices-gateway-pattern-dd-desc" id="microservices-gateway-pattern-dd-root">
<title id="microservices-gateway-pattern-dd-title">Mô hình kiến trúc microservices với API Gateway và cơ sở dữ liệu riêng cho từng service</title>
<desc id="microservices-gateway-pattern-dd-desc">Client gọi API Gateway qua HTTP/WebSocket; Gateway định tuyến REST tới các service, mỗi service có CSDL riêng; Service A phát sự kiện qua message broker tới Service B; Service B gọi REST nội bộ tới Service C.</desc>
<defs>
      <style>#microservices-gateway-pattern-dd-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #microservices-gateway-pattern-dd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #microservices-gateway-pattern-dd-root .diagram-container { width: 100%; overflow-x: auto; }
      #microservices-gateway-pattern-dd-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#microservices-gateway-pattern-dd-root .diagram-container { overflow-x: visible; }
}</style>
