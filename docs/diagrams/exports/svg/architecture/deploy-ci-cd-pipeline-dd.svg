<title id="deploy-ci-cd-pipeline-dd-title">Quy trình CI/CD từ mã nguồn đến VPS production</title>
<desc id="deploy-ci-cd-pipeline-dd-desc">ci.yml kiểm tra mọi nhánh; khi hợp nhất vào production, deploy-production.yml kiểm tra lại, build 7 image lên GHCR và SSH vào VPS, nơi deploy.sh sao lưu, kéo image, chạy migrate và tự rollback nếu healthcheck không đạt.</desc>
<defs>
      <style>#deploy-ci-cd-pipeline-dd-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #deploy-ci-cd-pipeline-dd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #deploy-ci-cd-pipeline-dd-root .diagram-container { width: 100%; overflow-x: auto; }
      #deploy-ci-cd-pipeline-dd-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#deploy-ci-cd-pipeline-dd-root .diagram-container { overflow-x: visible; }
}</style>
