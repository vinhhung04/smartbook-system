<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 1144" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-system-overview-dd-title architecture-system-overview-dd-desc" id="architecture-system-overview-dd-root">
<title id="architecture-system-overview-dd-title">Kiến trúc tổng thể của hệ thống SmartBook</title>
<desc id="architecture-system-overview-dd-desc">Ba ứng dụng khách đi qua Caddy và API Gateway tới năm dịch vụ, mỗi dịch vụ một cơ sở dữ liệu trong PostgreSQL; Redis, RabbitMQ và các dịch vụ bên ngoài hỗ trợ, sự kiện outbox quay về Gateway qua Socket.IO.</desc>
<defs>
      <style>#architecture-system-overview-dd-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #architecture-system-overview-dd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-system-overview-dd-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-system-overview-dd-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#architecture-system-overview-dd-root .diagram-container { overflow-x: visible; }
}</style>
