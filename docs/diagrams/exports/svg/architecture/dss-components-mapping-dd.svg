<title id="dss-components-mapping-dd-title">Ba thành phần của hệ hỗ trợ ra quyết định và cách ánh xạ vào SmartBook</title>
<desc id="dss-components-mapping-dd-desc">Người ra quyết định dùng trợ lý AI và bảng điều khiển; hai thành phần này dùng mô hình rủi ro, dự báo nhu cầu và thanh lọc ngân sách; các mô hình đọc borrow_db và inventory_db.</desc>
