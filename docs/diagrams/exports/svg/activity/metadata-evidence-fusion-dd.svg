<title id="metadata-evidence-fusion-dd-title">Quy trình hợp nhất bằng chứng metadata theo từng trường</title>
<desc id="metadata-evidence-fusion-dd-desc">Từ ISBN, truy vấn nguồn có cấu trúc, bổ sung nguồn khi thiếu hoặc xung đột, chuẩn hóa, gom nhóm, tính độ hỗ trợ noisy-OR, chọn nhóm mạnh nhất và để con người duyệt.</desc>
<defs>
      <style>#metadata-evidence-fusion-dd-root { --color-paper:  #ffffff;
