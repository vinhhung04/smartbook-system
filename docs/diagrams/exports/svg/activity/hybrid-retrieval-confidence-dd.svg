      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #hybrid-retrieval-confidence-dd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #hybrid-retrieval-confidence-dd-root .diagram-container { width: 100%; overflow-x: auto; }
      #hybrid-retrieval-confidence-dd-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 640px; line-height: 1.5; }
      @media print {
#hybrid-retrieval-confidence-dd-root .diagram-container { overflow-x: visible; }
}</style>
