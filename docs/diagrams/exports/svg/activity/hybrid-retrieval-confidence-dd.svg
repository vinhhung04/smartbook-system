<title id="hybrid-retrieval-confidence-dd-title">Quy trình truy xuất lai có đánh giá độ tin cậy trước khi sinh câu trả lời</title>
<desc id="hybrid-retrieval-confidence-dd-desc">Câu hỏi được tìm song song theo ngữ nghĩa và toàn văn, hợp nhất thứ hạng, đánh giá độ tin cậy rồi trả lời từ chối hoặc sinh câu trả lời có dẫn nguồn.</desc>
