<title id="auth-register-email-otp-dd-p1-title">Đăng ký tài khoản, phần 1: tạo tài khoản và gửi mã</title>
<desc id="auth-register-email-otp-dd-p1-desc">Bạn đọc đăng ký; Auth Service tạo tài khoản chờ xác minh, lưu HMAC của mã OTP và gửi email, trả 201 kèm thông tin thử thách dù gửi email thành công hay thất bại.</desc>
