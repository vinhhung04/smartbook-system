<title id="auth-register-email-otp-dd-p3-title">Đăng ký tài khoản, phần 3: xác minh mã</title>
<desc id="auth-register-email-otp-dd-p3-desc">Bạn đọc nhập mã; Auth Service giữ một lượt thử bằng UPDATE có điều kiện, trả lỗi khi mã sai, hết hạn hoặc vượt 5 lần thử, nếu đúng thì kích hoạt tài khoản trong một giao dịch.</desc>
