      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #auth-register-email-otp-dd-p3-root { font-family: var(--font-sans); color: var(--color-ink); }
      #auth-register-email-otp-dd-p3-root .diagram-container { width: 100%; overflow-x: auto; }
      #auth-register-email-otp-dd-p3-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#auth-register-email-otp-dd-p3-root .diagram-container { overflow-x: visible; }
