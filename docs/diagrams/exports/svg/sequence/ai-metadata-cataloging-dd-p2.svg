<title id="ai-metadata-cataloging-dd-p2-title">Biên mục sách với trích xuất thông tin bằng AI, phần 2</title>
<desc id="ai-metadata-cataloging-dd-p2-desc">Kết quả được lưu thành bản nháp đối soát; quản lý duyệt từng trường, kiểm tra trùng lặp và áp dụng, Inventory ghi các trường được chấp nhận trong một giao dịch.</desc>
<defs>
      <style>#ai-metadata-cataloging-dd-p2-root { --color-paper:  #ffffff;
