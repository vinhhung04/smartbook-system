<title id="ai-metadata-cataloging-dd-p1-title">Biên mục sách với trích xuất thông tin bằng AI, phần 1</title>
<desc id="ai-metadata-cataloging-dd-p1-desc">AI Service chuẩn hóa ISBN, truy vấn nguồn metadata, gọi thêm nguồn khi thiếu, hợp nhất bằng chứng theo trường và chuẩn hóa thực thể qua Inventory.</desc>
