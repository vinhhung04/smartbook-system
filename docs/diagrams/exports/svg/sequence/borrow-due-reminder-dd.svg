<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="borrow-due-reminder-dd-title borrow-due-reminder-dd-desc" id="borrow-due-reminder-dd-root">
<title id="borrow-due-reminder-dd-title">Nhắc hạn trả theo mức rủi ro</title>
<desc id="borrow-due-reminder-dd-desc">Tác vụ nhắc hạn lấy danh sách cuốn sắp đến hạn xếp theo điểm rủi ro trả trễ từ Analytics, dự phòng theo hạn trả khi Analytics lỗi, rồi tạo và gửi nhắc nhở.</desc>
<defs>
      <style>#borrow-due-reminder-dd-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #borrow-due-reminder-dd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #borrow-due-reminder-dd-root .diagram-container { width: 100%; overflow-x: auto; }
      #borrow-due-reminder-dd-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#borrow-due-reminder-dd-root .diagram-container { overflow-x: visible; }
}</style>
