<title id="auth-login-email-otp-dd-p3-title">Đăng nhập Web, phần 3: cấp phiên</title>
<desc id="auth-login-email-otp-dd-p3-desc">Sau khi mã OTP đúng, Auth Service đọc lại user, mốc thu hồi token trên Redis và quyền; trong mọi trường hợp đăng nhập thành công, Auth Service ký JWT và Web App lưu token.</desc>
<defs>
      <style>#auth-login-email-otp-dd-p3-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #auth-login-email-otp-dd-p3-root { font-family: var(--font-sans); color: var(--color-ink); }
      #auth-login-email-otp-dd-p3-root .diagram-container { width: 100%; overflow-x: auto; }
      #auth-login-email-otp-dd-p3-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#auth-login-email-otp-dd-p3-root .diagram-container { overflow-x: visible; }
}</style>
