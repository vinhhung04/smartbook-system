<title id="borrow-loan-return-dd-title">Trả sách và tính phí phạt</title>
<desc id="borrow-loan-return-dd-desc">Thủ thư ghi nhận trả sách; Borrow Service tính phí, nhờ Inventory đưa sách về khả dụng, cập nhật phiếu mượn, khoản phạt, nhật ký và thông báo.</desc>
<defs>
      <style>#borrow-loan-return-dd-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #borrow-loan-return-dd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #borrow-loan-return-dd-root .diagram-container { width: 100%; overflow-x: auto; }
      #borrow-loan-return-dd-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#borrow-loan-return-dd-root .diagram-container { overflow-x: visible; }
}</style>
