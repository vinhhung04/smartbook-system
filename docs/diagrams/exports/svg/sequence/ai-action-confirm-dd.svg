<title id="ai-action-confirm-dd-title">Xác nhận hành động do AI đề xuất</title>
<desc id="ai-action-confirm-dd-desc">Quản lý xác nhận hành động; AI Service kiểm tra hạn và quyền hiện tại, rồi gọi API nghiệp vụ bằng JWT người dùng, ghi trạng thái và nhật ký, đẩy sự kiện kết quả.</desc>
<defs>
      <style>#ai-action-confirm-dd-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #ai-action-confirm-dd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ai-action-confirm-dd-root .diagram-container { width: 100%; overflow-x: auto; }
      #ai-action-confirm-dd-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#ai-action-confirm-dd-root .diagram-container { overflow-x: visible; }
}</style>
