  <marker id="ai-copilot-query-verification-dd-p3-ai-copilot-query-verification-dd-p3-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#000000" stroke-width="1.2"/></marker>
