<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-copilot-query-verification-dd-p3-title ai-copilot-query-verification-dd-p3-desc" id="ai-copilot-query-verification-dd-p3-root">
<title id="ai-copilot-query-verification-dd-p3-title">Trợ lý AI, phần 3: lưu và trả kết quả</title>
<desc id="ai-copilot-query-verification-dd-p3-desc">Khi an toàn và cần hành động, AI Service lưu hành động chờ xác nhận hết hạn sau 10 phút, lưu tin nhắn cùng bằng chứng, rồi phát luồng SSE tới Web App để hiển thị câu trả lời, biểu đồ và trạng thái kiểm chứng.</desc>
<defs>
      <style>#ai-copilot-query-verification-dd-p3-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #ai-copilot-query-verification-dd-p3-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ai-copilot-query-verification-dd-p3-root .diagram-container { width: 100%; overflow-x: auto; }
      #ai-copilot-query-verification-dd-p3-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#ai-copilot-query-verification-dd-p3-root .diagram-container { overflow-x: visible; }
}</style>
