<rect x="538" y="154" width="156" height="50" rx="2" fill="#f7f7f7"/>
<text x="616.0" y="167" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle"><tspan font-weight="700">15.</tspan> Lưu ai_pending_actions</text>
<text x="616.0" y="183" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle">(PENDING_CONFIRMATION,</text>
<text x="616.0" y="199" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle">hết hạn 10 phút)</text>
