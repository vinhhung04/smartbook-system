<text x="478" y="139" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="start" font-weight="700">[safe_to_act = true và câu hỏi dẫn tới việc cần làm]</text>
<rect x="536" y="234" width="160" height="34" rx="2" fill="#ffffff"/>
<text x="616.0" y="247" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle"><tspan font-weight="700">16.</tspan> Lưu tin nhắn, bằng chứng,</text>
<text x="616.0" y="263" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle">đặc tả biểu đồ</text>
<rect x="326" y="286" width="168" height="66" rx="2" fill="#ffffff"/>
<text x="410.0" y="299" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle"><tspan font-weight="700">17.</tspan> SSE: bản nháp → đang kiểm</text>
<text x="410.0" y="315" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle">chứng → done {answer,</text>
<text x="410.0" y="331" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle">visualizations, evidence,</text>
<text x="410.0" y="347" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle">verification}</text>
<rect x="108" y="370" width="180" height="50" rx="2" fill="#ffffff"/>
<text x="198.0" y="383" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle"><tspan font-weight="700">18.</tspan> Văn bản + biểu đồ (component</text>
<text x="198.0" y="399" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle">whitelist) + bằng chứng + trạng</text>
<text x="198.0" y="415" fill="#000000" font-size="12" font-family="'Times New Roman', Times, serif" text-anchor="middle">thái kiểm chứng</text>
