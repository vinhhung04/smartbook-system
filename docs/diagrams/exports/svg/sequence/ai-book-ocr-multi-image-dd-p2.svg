<title id="ai-book-ocr-multi-image-dd-p2-title">Nhập sách bằng OCR nhiều ảnh, phần 2: đối chiếu và lưu</title>
<desc id="ai-book-ocr-multi-image-dd-p2-desc">AI Service tra cứu ISBN khi có đúng một mã hợp lệ, đối chiếu ảnh với nguồn tra cứu, trả đề xuất theo từng ô; người dùng áp dụng, xử lý trùng lặp và lưu qua bản nháp đối soát của Inventory.</desc>
