<svg viewBox="0 0 800 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-login-email-otp-dd-p1-title auth-login-email-otp-dd-p1-desc" id="auth-login-email-otp-dd-p1-root">
<title id="auth-login-email-otp-dd-p1-title">Đăng nhập Web, phần 1: kiểm tra mật khẩu</title>
<desc id="auth-login-email-otp-dd-p1-desc">Người dùng gửi tên đăng nhập và mật khẩu qua API Gateway; Auth Service giới hạn tần suất, tìm user, xử lý sai mật khẩu bằng 401/403 và lấy vai trò, quyền khi mật khẩu đúng.</desc>
<defs>
      <style>#auth-login-email-otp-dd-p1-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #auth-login-email-otp-dd-p1-root { font-family: var(--font-sans); color: var(--color-ink); }
      #auth-login-email-otp-dd-p1-root .diagram-container { width: 100%; overflow-x: auto; }
      #auth-login-email-otp-dd-p1-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#auth-login-email-otp-dd-p1-root .diagram-container { overflow-x: visible; }
}</style>
