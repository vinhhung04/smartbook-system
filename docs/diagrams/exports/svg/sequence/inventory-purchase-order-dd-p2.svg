<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inventory-purchase-order-dd-p2-title inventory-purchase-order-dd-p2-desc" id="inventory-purchase-order-dd-p2-root">
<title id="inventory-purchase-order-dd-p2-title">Lập, duyệt và gửi đơn đặt hàng, phần 2</title>
<desc id="inventory-purchase-order-dd-p2-desc">Gửi đơn cho nhà cung cấp tạo bản ghi gửi có token và sự kiện outbox; bộ phát outbox đọc sự kiện chưa phát và đẩy lên RabbitMQ.</desc>
<defs>
      <style>#inventory-purchase-order-dd-p2-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #inventory-purchase-order-dd-p2-root { font-family: var(--font-sans); color: var(--color-ink); }
      #inventory-purchase-order-dd-p2-root .diagram-container { width: 100%; overflow-x: auto; }
      #inventory-purchase-order-dd-p2-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#inventory-purchase-order-dd-p2-root .diagram-container { overflow-x: visible; }
}</style>
