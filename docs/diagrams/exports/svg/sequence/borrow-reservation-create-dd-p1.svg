<title id="borrow-reservation-create-dd-p1-title">Đặt giữ sách, phần 1</title>
<desc id="borrow-reservation-create-dd-p1-desc">Khách hàng đặt giữ qua API Gateway; Borrow Service kiểm tra hội viên và giới hạn, trả lại phiếu cũ nếu khóa idempotency đã dùng.</desc>
<defs>
      <style>#borrow-reservation-create-dd-p1-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #borrow-reservation-create-dd-p1-root { font-family: var(--font-sans); color: var(--color-ink); }
      #borrow-reservation-create-dd-p1-root .diagram-container { width: 100%; overflow-x: auto; }
      #borrow-reservation-create-dd-p1-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#borrow-reservation-create-dd-p1-root .diagram-container { overflow-x: visible; }
}</style>
