<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-register-email-otp-dd-p2-title auth-register-email-otp-dd-p2-desc" id="auth-register-email-otp-dd-p2-root">
<title id="auth-register-email-otp-dd-p2-title">Đăng ký tài khoản, phần 2: gửi lại mã</title>
<desc id="auth-register-email-otp-dd-p2-desc">Khi bạn đọc yêu cầu gửi lại mã, Auth Service áp thời gian chờ 60 giây và tối đa 10 lần gửi mỗi giờ, thay mã mới, gửi email và trả lại thông tin thử thách.</desc>
<defs>
      <style>#auth-register-email-otp-dd-p2-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #auth-register-email-otp-dd-p2-root { font-family: var(--font-sans); color: var(--color-ink); }
      #auth-register-email-otp-dd-p2-root .diagram-container { width: 100%; overflow-x: auto; }
      #auth-register-email-otp-dd-p2-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#auth-register-email-otp-dd-p2-root .diagram-container { overflow-x: visible; }
}</style>
