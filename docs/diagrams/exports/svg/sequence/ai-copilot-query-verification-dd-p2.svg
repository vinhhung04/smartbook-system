<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 868" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ai-copilot-query-verification-dd-p2-title ai-copilot-query-verification-dd-p2-desc" id="ai-copilot-query-verification-dd-p2-root">
<title id="ai-copilot-query-verification-dd-p2-title">Trợ lý AI, phần 2: bằng chứng, sinh câu trả lời và kiểm chứng</title>
<desc id="ai-copilot-query-verification-dd-p2-desc">AI Service gọi các công cụ phân tích bằng JWT người dùng, dựng bằng chứng và đặc tả biểu đồ, nhờ LLM viết câu trả lời rồi kiểm chứng tất định: sinh lại tối đa một lần, lược câu sai hoặc cho qua.</desc>
<defs>
      <style>#ai-copilot-query-verification-dd-p2-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #ai-copilot-query-verification-dd-p2-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ai-copilot-query-verification-dd-p2-root .diagram-container { width: 100%; overflow-x: auto; }
      #ai-copilot-query-verification-dd-p2-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#ai-copilot-query-verification-dd-p2-root .diagram-container { overflow-x: visible; }
}</style>
