<title id="auth-service-iam-dd-p2-title">ERD auth_db: token và mã OTP</title>
<desc id="auth-service-iam-dd-p2-desc">Mỗi user sở hữu nhiều refresh token, token đặt lại mật khẩu, thử thách OTP qua email và token xác minh email kiểu cũ; mọi quan hệ là một – nhiều.</desc>
