      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #auth-service-iam-dd-p2-root { font-family: var(--font-sans); color: var(--color-ink); }
      #auth-service-iam-dd-p2-root .diagram-container { width: 100%; overflow-x: auto; }
      #auth-service-iam-dd-p2-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#auth-service-iam-dd-p2-root .diagram-container { overflow-x: visible; }
}</style>
