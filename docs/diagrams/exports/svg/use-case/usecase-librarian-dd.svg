<title id="usecase-librarian-dd-title">Sơ đồ use case của tác nhân Thủ thư</title>
<desc id="usecase-librarian-dd-desc">Thủ thư quản lý hồ sơ bạn đọc và gói hội viên, xử lý đặt giữ, phát và nhận trả sách, duyệt gia hạn, thu phạt, tìm sách bằng ảnh bìa và hỏi chatbot.</desc>
<defs>
      <style>#usecase-librarian-dd-root { --color-paper:  #ffffff;
      --color-ink:    #1f3864;
      --color-muted:  #475569;
      --color-accent: #b45309;
      --font-sans:    Arial, 'Helvetica Neue', Helvetica, sans-serif;
      --font-serif:   'Times New Roman', Times, serif;
      --font-mono:    Consolas, 'Courier New', ui-monospace, monospace; }
      #usecase-librarian-dd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #usecase-librarian-dd-root .diagram-container { width: 100%; overflow-x: auto; }
      #usecase-librarian-dd-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#usecase-librarian-dd-root .diagram-container { overflow-x: visible; }
}</style>
