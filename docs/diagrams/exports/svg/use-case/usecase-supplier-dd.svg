<title id="usecase-supplier-dd-title">Sơ đồ use case của tác nhân Nhà cung cấp</title>
<desc id="usecase-supplier-dd-desc">Nhà cung cấp xem và xác nhận đơn đặt hàng, gửi hóa đơn giao hàng và phản hồi báo cáo thiếu hàng.</desc>
<defs>
      <style>#usecase-supplier-dd-root { --color-paper:  #ffffff;
