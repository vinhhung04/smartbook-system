<title id="usecase-admin-scheduler-dd-title">Sơ đồ use case của tác nhân Quản trị hệ thống và Bộ lập lịch</title>
<desc id="usecase-admin-scheduler-dd-desc">Quản trị hệ thống quản lý người dùng, vai trò và quyền, xem dự báo rủi ro, nhật ký kiểm toán, giám sát hệ thống; Bộ lập lịch tự xử lý quá hạn và nhắc hạn trả.</desc>
