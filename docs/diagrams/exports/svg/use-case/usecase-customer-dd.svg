<title id="usecase-customer-dd-title">Sơ đồ use case của tác nhân Khách hàng</title>
<desc id="usecase-customer-dd-desc">Khách hàng tra cứu, tìm bằng ảnh bìa, đặt giữ, theo dõi mượn, thanh toán phạt, quản lý yêu thích, đánh giá, xem gợi ý và thông báo.</desc>
<defs>
      <style>#usecase-customer-dd-root { --color-paper:  #ffffff;
