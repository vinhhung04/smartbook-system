      #usecase-warehouse-staff-dd-root { font-family: var(--font-sans); color: var(--color-ink); }
      #usecase-warehouse-staff-dd-root .diagram-container { width: 100%; overflow-x: auto; }
      #usecase-warehouse-staff-dd-root .note { font-size: 0.85rem; color: var(--color-muted); margin-top: 1rem; max-width: 800px; line-height: 1.5; }
      @media print {
#usecase-warehouse-staff-dd-root .diagram-container { overflow-x: visible; }
