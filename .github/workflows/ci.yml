name: CI

on:
  push:
    branches: [main, hungg]
  pull_request:
    branches: [main, hungg]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.6.2
  NODE_VERSION: 20

jobs:
  verify:
    name: Full workspace verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt

      - run: pnpm install --frozen-lockfile
      - run: pip install -r services/ai-service/requirements.txt pytest
      - run: pnpm verify

  prisma:
    name: Prisma schema (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            path: services/auth-service
          - name: inventory-service
            path: services/inventory-service
          - name: borrow-service
            path: services/borrow-service
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma validate
        working-directory: ${{ matrix.path }}
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma validate

  compose-config:
    name: docker-compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: cp .env.example .env

      - run: docker compose config -q

  integration:
    name: Integration flows (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate local .env
        run: |
          node scripts/init-demo-env.mjs
          # scripts/*.mjs collectively log in as several roles across 7 flows in one
          # run — well over the production default of 10 logins per 15 minutes.
          echo "AUTH_LOGIN_RATE_LIMIT_MAX=1000" >> .env

      - name: Start core stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Seed demo data
        run: pnpm demo:seed

      # No npm dependencies — each script only uses Node built-ins, so they run
      # directly against the gateway at http://localhost:3000 without `pnpm install`.
      # A few scripts self-sign a JWT for a synthetic test actor instead of calling
      # /auth/login, and fall back to a hardcoded secret when JWT_SECRET isn't set —
      # that fallback never matches the random secret init-demo-env.mjs generated,
      # so it must be forwarded explicitly here or those scripts get 403s.
      - name: Run integration flows
        run: |
          set -e
          export JWT_SECRET="$(grep -m1 '^JWT_SECRET=' .env | cut -d= -f2-)"
          for f in \
            rbac-role-access-integration.mjs \
            purchase-supplier-receiving-integration.mjs \
            borrow-phase2-integration.mjs \
            reservation-pickup-loan-return-integration.mjs \
            supplier-portal-integration.mjs \
            admin-user-management-integration.mjs \
            analytics-integration.mjs \
          ; do
            echo "::group::$f"
            node "scripts/$f"
            echo "::endgroup::"
          done

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: E2E flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Generate local .env
        run: node scripts/init-demo-env.mjs

      # Full stack including smartbook-ui: the built production image, not the Vite dev
      # server — same thing a real user's browser hits, and one less moving part in CI.
      - name: Start full stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Seed demo data
        run: pnpm demo:seed

      - name: Run E2E tests
        working-directory: apps/web
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Tear down
        if: always()
        run: docker compose down -v
