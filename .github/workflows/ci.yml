name: CI

on:
  push:
    branches: [main, hungg, khoa]
  pull_request:
    branches: [main, hungg, khoa]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.6.2
  NODE_VERSION: 24.16.0

jobs:
  verify:
    name: Full workspace verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: services/ai-service/requirements*.lock

      - run: pnpm install --frozen-lockfile
      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r services/ai-service/requirements-build.lock
          python -m pip install --require-hashes --only-binary=:all: -r services/ai-service/requirements-linux-amd64-py312.lock
          python -m pip install --require-hashes --only-binary=:all: -r services/ai-service/requirements-test.lock
      - name: Verify workspace
        env:
          OPENROUTER_API_KEY: ''
          ENABLE_NIGHTLY_BRIEFING: 'false'
        run: |
          mkdir -p test-results/qa
          set -o pipefail
          pnpm verify 2>&1 | tee test-results/qa/verify.log
      - name: Curate redacted artifact bundle
        if: always()
        run: node scripts/testing/sanitize-artifacts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-results
          path: test-results/qa/safe-artifacts/
          retention-days: 7

  ai-postgres:
    # ai-service integration tests that need a real Postgres + pgvector (vector
    # store, BOOK_METADATA catalog sync, AI Action Center concurrent confirms).
    # Offline and deterministic: embeddings are faked, OPENROUTER_API_KEY is unset.
    # In `verify` these same files are skipped (no TEST_PG_DSN).
    name: AI integration (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ci
          # Isolated loopback-only CI database; no reusable credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ai_pg_audit_c1c1c1c1
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_pg_audit_c1c1c1c1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
          cache: pip
          cache-dependency-path: services/ai-service/requirements*.lock

      - name: Install locked Python runtime and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r services/ai-service/requirements-build.lock
          python -m pip install --require-hashes --only-binary=:all: -r services/ai-service/requirements-linux-amd64-py312.lock
          python -m pip install --require-hashes --only-binary=:all: -r services/ai-service/requirements-test.lock

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Explicit AI schema owner job
        working-directory: services/ai-service
        env:
          DATABASE_URL: postgresql+asyncpg://ci@127.0.0.1:5432/ai_pg_audit_c1c1c1c1
        run: python migrate.py

      - name: Postgres-backed ai-service tests
        working-directory: services/ai-service
        env:
          TEST_PG_DSN: postgresql+asyncpg://ci@127.0.0.1:5432/ai_pg_audit_c1c1c1c1
          AI_SCHEMA_MANAGED_EXTERNALLY: 'true'
          OPENROUTER_API_KEY: ''
          ENABLE_NIGHTLY_BRIEFING: 'false'
        run: |
          export INTERNAL_SERVICE_KEY="$(openssl rand -hex 32)"
          python -m pytest test_pgvector_store.py test_agent_store_pg.py -v --junitxml=../../test-results/qa/ai-postgres.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = ET.parse('../../test-results/qa/ai-postgres.xml').getroot().iter('testsuite')
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for suite in suites:
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          assert totals == {'tests': 12, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          PY
      - name: Curate redacted artifact bundle
        if: always()
        run: node scripts/testing/sanitize-artifacts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-postgres-results
          path: test-results/qa/safe-artifacts/
          retention-days: 7

  prisma:
    name: Prisma schema (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            path: services/auth-service
          - name: inventory-service
            path: services/inventory-service
          - name: borrow-service
            path: services/borrow-service
          - name: monitoring-service
            path: services/monitoring-service
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma validate
        working-directory: ${{ matrix.path }}
        env:
          DATABASE_URL: postgresql://ci@localhost:5432/ci
        run: npx prisma validate

  compose-config:
    name: docker-compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - run: cp .env.example .env

      - run: docker compose config -q

      - run: docker compose --profile ai --profile monitoring config -q

      # Monitoring is opt-in: the default stack must not start Prometheus or Grafana.
      - run: |
          services="$(docker compose config --services)"
          echo "$services"
          ! echo "$services" | grep -Ex 'prometheus|grafana|node-exporter|cadvisor|postgres-exporter|redis-exporter'

      # Production stack renders with the documented example environment, and no
      # business service depends on a monitoring container.
      - name: Production compose validation
        run: |
          IMAGE_TAG="$(printf 'a%.0s' $(seq 40))" docker compose -f compose.prod.yml --env-file .env.production.example config > /tmp/prod.yml
          python3 - <<'PY'
          import yaml
          c = yaml.safe_load(open('/tmp/prod.yml'))
          mon = {'monitoring-service', 'prometheus', 'grafana', 'node-exporter', 'cadvisor', 'postgres-exporter', 'redis-exporter'}
          bad = [n for n, s in c['services'].items() if n not in mon and set((s.get('depends_on') or {})) & mon]
          assert not bad, f'business services depend on monitoring: {bad}'
          published = [n for n, s in c['services'].items() if s.get('ports') and n not in ('caddy', 'grafana')]
          assert not published, f'unexpected published ports: {published}'
          assert all(p.get('host_ip') == '127.0.0.1' for p in c['services']['grafana']['ports']), 'Grafana must bind loopback only'
          PY

  monitoring:
    name: Monitoring service (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg15-bookworm@sha256:e0b617fffc06dd37323ee99873c7a8683f19f1dce34633670262b0113ce32638
        env:
          POSTGRES_USER: monitoring_ci
          POSTGRES_PASSWORD: monitoring_ci_password
          POSTGRES_DB: monitoring_test
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U monitoring_ci -d monitoring_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate and check schema drift
        working-directory: services/monitoring-service
        env:
          DATABASE_URL: postgresql://monitoring_ci:monitoring_ci_password@127.0.0.1:5432/monitoring_test
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      # Unit + database lifecycle/delivery tests; the DB suite must not skip here.
      - name: Monitoring service tests
        working-directory: services/monitoring-service
        env:
          MONITORING_TEST_DATABASE_URL: postgresql://monitoring_ci:monitoring_ci_password@127.0.0.1:5432/monitoring_test
          NODE_ENV: test
        run: |
          set -o pipefail
          npx prisma generate
          node --test --test-concurrency=1 test/*.test.js | tee monitoring-tests.log
          ! grep -E '^# skipped [1-9]' monitoring-tests.log

  integration:
    name: Integration flows (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: pnpm install --frozen-lockfile

      - name: Create disposable test environment
        run: pnpm test:stack setup
      - name: Start core stack
        run: pnpm test:stack up
      - name: Seed deterministic fixtures
        run: pnpm test:stack seed
      - name: Start AI service with no paid provider credentials
        run: pnpm test:stack up-ai
      - name: Service contracts
        run: pnpm test:stack contracts
      - name: PostgreSQL transaction tests (no database skips)
        run: |
          set -o pipefail
          pnpm test:stack db 2>&1 | tee test-results/qa/borrow-postgres.log
      - name: Run integration flows
        run: pnpm test:stack integration
      - name: Operations security regression (host Docker CLI)
        env:
          SMARTBOOK_TEST_CADDY_IMAGE: smartbook-qa-caddy:${{ github.sha }}
        run: |
          docker build -f deploy/Dockerfile.caddy --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$SMARTBOOK_TEST_CADDY_IMAGE" .
          node --test --test-concurrency=1 tests/production-readiness/*.test.mjs tests/production-readiness/integration/*.test.mjs
      - name: Smoke command
        run: pnpm test:stack smoke
      - name: Dump service logs on failure
        if: failure()
        run: pnpm test:stack logs > test-results/qa/docker.log
      - name: Curate redacted artifact bundle
        if: always()
        run: node scripts/testing/sanitize-artifacts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: test-results/qa/safe-artifacts/
          retention-days: 7
      - name: Stop disposable project (retain data)
        if: always()
        run: pnpm test:stack stop

  e2e:
    name: E2E flows (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Create disposable test environment
        run: pnpm test:stack setup
      - name: Start full stack
        run: pnpm test:stack up
      - name: Seed deterministic fixtures
        run: pnpm test:stack seed
      - name: Run E2E tests (local VNPay simulator, no payment credentials)
        run: pnpm test:stack e2e
      - name: Dump service logs on failure
        if: failure()
        run: pnpm test:stack logs > test-results/qa/docker.log
      - name: Curate redacted Playwright summary
        if: always()
        run: node scripts/testing/sanitize-artifacts.mjs
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/qa/safe-artifacts/
          retention-days: 7
      - name: Stop disposable project (retain data)
        if: always()
        run: pnpm test:stack stop
