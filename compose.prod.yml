# SmartBook production stack (VPS "smartbook", https://smartbook.io.vn).
#
# Separate from docker-compose.yml (development): nothing here is built on the server.
# Every application image is built by .github/workflows/deploy-production.yml, pushed to
# GHCR and pinned by commit SHA (IMAGE_TAG). Run it through deploy/scripts/dc, which
# loads .env (secrets) and state/release.env (IMAGE_TAG) — see docs/DEPLOYMENT.md.
#
# Only Caddy publishes ports (80/443). db, redis and rabbitmq sit on an internal network
# with no route to the internet and no route from Caddy.

name: smartbook

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app-defaults
  restart: unless-stopped
  logging: *default-logging
  networks: [app, data]
  init: true
  stop_grace_period: 45s

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  # first boot also runs `prisma migrate deploy`
  start_period: 60s

services:
  db:
    image: pgvector/pgvector:0.8.7-pg15-bookworm@sha256:e0b617fffc06dd37323ee99873c7a8683f19f1dce34633670262b0113ce32638
    restart: unless-stopped
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      ANALYTICS_DB_USER: ${ANALYTICS_DB_USER:-analytics_reader}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?Set ANALYTICS_DB_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}
      BORROW_DB_PASSWORD: ${BORROW_DB_PASSWORD:?Set BORROW_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD}
      # Optional: monitoring_db is created by db-init/05-monitoring-db.sh only when set.
      MONITORING_DB_PASSWORD: ${MONITORING_DB_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # only read when postgres_data is empty (first boot)
      - ./db-init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
    logging: *default-logging
    networks: [data]

  redis:
    image: redis:7.4.12-alpine3.22@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }
    logging: *default-logging
    networks: [data]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1", memory: 768m }
    logging: *default-logging
    networks: [data]

  inventory-service:
    <<: *app-defaults
    image: ${INVENTORY_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-inventory-service:${IMAGE_TAG:?Set IMAGE_TAG (state/release.env)}}
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://inventory_runtime:${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}@db:5432/inventory_db?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ALLOWED_ORIGINS=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - GATEWAY_URL=http://api-gateway:3000
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      - ANALYTICS_SERVICE_URL=http://analytics-service:3006
      - AGING_INVENTORY_DAYS_THRESHOLD=${AGING_INVENTORY_DAYS_THRESHOLD:-90}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Procurement document sharing e-mails; unset SMTP_HOST = e-mail shares are recorded as FAILED
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-SmartBook Library <noreply@smartbook.io.vn>}
      - PUBLIC_WEB_URL=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
    volumes:
      - packing_evidence_data:/app/evidence/packing
      - procurement_document_data:/app/evidence/procurement
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      <<: *node-healthcheck
    deploy:
      resources:
        limits: { cpus: "1", memory: 768m }

  auth-service:
    <<: *app-defaults
    image: ${AUTH_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-auth-service:${IMAGE_TAG:?Set IMAGE_TAG (state/release.env)}}
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://auth_runtime:${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD}@db:5432/auth_db?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-2h}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      - INVENTORY_SERVICE_URL=http://inventory-service:3001
      - ALLOWED_ORIGINS=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-SmartBook Library <noreply@smartbook.io.vn>}
      - AUTH_LOGIN_RATE_LIMIT_MAX=${AUTH_LOGIN_RATE_LIMIT_MAX:-10}
      - AUTH_OTP_VERIFY_RATE_LIMIT_MAX=${AUTH_OTP_VERIFY_RATE_LIMIT_MAX:-30}
      - AUTH_OTP_RESEND_RATE_LIMIT_MAX=${AUTH_OTP_RESEND_RATE_LIMIT_MAX:-10}
      # Email OTP (docs/DEPLOYMENT.md "Email OTP rollout"). The secret is required:
      # auth-service refuses to start in production without it.
      - OTP_HMAC_SECRET=${OTP_HMAC_SECRET:?Set OTP_HMAC_SECRET in .env (openssl rand -hex 32)}
      - REGISTRATION_EMAIL_VERIFICATION=${REGISTRATION_EMAIL_VERIFICATION:-required}
      - STAFF_EMAIL_OTP_MODE=${STAFF_EMAIL_OTP_MODE:-off}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      <<: *node-healthcheck
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  borrow-service:
    <<: *app-defaults
    image: ${BORROW_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-borrow-service:${IMAGE_TAG:?Set IMAGE_TAG (state/release.env)}}
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://borrow_runtime:${BORROW_DB_PASSWORD:?Set BORROW_DB_PASSWORD}@db:5432/borrow_db?schema=public
      - INVENTORY_SERVICE_URL=http://inventory-service:3001
      - ANALYTICS_SERVICE_URL=http://analytics-service:3006
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - GATEWAY_URL=http://api-gateway:3000
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - ALLOWED_ORIGINS=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-SmartBook Library <noreply@smartbook.io.vn>}
      - FRONTEND_URL=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-}
      - VNPAY_PAYMENT_URL=${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      - VNPAY_RETURN_URL=${PUBLIC_API_ORIGIN:-https://api.smartbook.io.vn}/webhooks/vnpay/return
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3005/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      <<: *node-healthcheck
    deploy:
      resources:
        limits: { cpus: "1", memory: 768m }

  analytics-service:
    <<: *app-defaults
    image: ${ANALYTICS_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-analytics-service:${IMAGE_TAG:?Set IMAGE_TAG (state/release.env)}}
    environment:
      - NODE_ENV=production
      - PORT=3006
      - INVENTORY_DATABASE_URL=postgresql://${ANALYTICS_DB_USER:-analytics_reader}:${ANALYTICS_DB_PASSWORD}@db:5432/inventory_db?schema=public
      - BORROW_DATABASE_URL=postgresql://${ANALYTICS_DB_USER:-analytics_reader}:${ANALYTICS_DB_PASSWORD}@db:5432/borrow_db?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ALLOWED_ORIGINS=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - LOW_STOCK_THRESHOLD=${LOW_STOCK_THRESHOLD:-5}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      # its read-only role reads tables the two services' migrations create
      inventory-service: { condition: service_healthy }
      borrow-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3006/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      <<: *node-healthcheck
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  ai-service:
    <<: *app-defaults
    image: ${AI_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-ai-service:${IMAGE_TAG:?Set IMAGE_TAG (state/release.env)}}
    depends_on:
      db: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    environment:
      - AI_SCHEMA_MANAGED_EXTERNALLY=true
      - DATABASE_URL=postgresql+asyncpg://ai_runtime:${AI_DB_PASSWORD:?Set AI_DB_PASSWORD}@db:5432/ai_db
      - SMARTBOOK_GATEWAY_URL=http://api-gateway:3000
      - INVENTORY_SERVICE_URL=http://inventory-service:3001
      - BORROW_SERVICE_URL=http://borrow-service:3005
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      - CATALOG_SYNC_INTERVAL_SECONDS=${CATALOG_SYNC_INTERVAL_SECONDS:-300}
      - RECOMMENDATION_MODEL=${RECOMMENDATION_MODEL:-v2}
      - RAG_RETRIEVAL_TIMEOUT_SECONDS=${RAG_RETRIEVAL_TIMEOUT_SECONDS:-8}
      - CHAT_LLM_TIMEOUT_SECONDS=${CHAT_LLM_TIMEOUT_SECONDS:-12}
      # OpenRouter is the only inference backend (text, tools, vision/OCR, embeddings) — no GPU, no local LLM.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_TEXT_MODEL=${OPENROUTER_TEXT_MODEL:-qwen/qwen3.7-flash}
      - OPENROUTER_ASSISTANT_MODEL=${OPENROUTER_ASSISTANT_MODEL:-qwen/qwen3.7-flash}
      - OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL:-qwen/qwen3.7-flash}
      - OPENROUTER_FALLBACK_MODEL=${OPENROUTER_FALLBACK_MODEL:-}
      - ASSISTANT_TOOL_CONTEXT_CHARS=${ASSISTANT_TOOL_CONTEXT_CHARS:-2000}
      - COPILOT_SEMANTIC_PLANNER=${COPILOT_SEMANTIC_PLANNER:-on}
      - COPILOT_SEMANTIC_PLANNER_TIMEOUT_SECONDS=${COPILOT_SEMANTIC_PLANNER_TIMEOUT_SECONDS:-5}
      - OPENROUTER_EMBED_MODEL=${OPENROUTER_EMBED_MODEL:-qwen/qwen3-embedding-8b}
      - OPENROUTER_EMBED_DIMENSIONS=${OPENROUTER_EMBED_DIMENSIONS:-768}
      - OPENROUTER_EMBED_TIMEOUT_SECONDS=${OPENROUTER_EMBED_TIMEOUT_SECONDS:-30}
      - RAG_ABSTENTION_ENABLED=${RAG_ABSTENTION_ENABLED:-true}
      - GOOGLE_BOOKS_API_BASE_URL=${GOOGLE_BOOKS_API_BASE_URL:-https://www.googleapis.com/books/v1/volumes}
      - OPEN_LIBRARY_API_BASE_URL=${OPEN_LIBRARY_API_BASE_URL:-https://openlibrary.org/api/books}
      - BOOK_LOOKUP_TIMEOUT_SECONDS=${BOOK_LOOKUP_TIMEOUT_SECONDS:-15}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - ENABLE_MARKETPLACE_LOOKUP=${ENABLE_MARKETPLACE_LOOKUP:-true}
      - ENABLE_FIELD_LEVEL_ISBN_RETRIEVAL=${ENABLE_FIELD_LEVEL_ISBN_RETRIEVAL:-false}
      - ENABLE_METADATA_INTELLIGENCE_V2=${ENABLE_METADATA_INTELLIGENCE_V2:-false}
      - ISBN_FUSION_MODE=${ISBN_FUSION_MODE:-evidence}
      - ISBN_LOOKUP_TOTAL_BUDGET_SECONDS=${ISBN_LOOKUP_TOTAL_BUDGET_SECONDS:-45}
      - ISBN_INCOMPLETE_CACHE_TTL_SECONDS=${ISBN_INCOMPLETE_CACHE_TTL_SECONDS:-600}
      - ISBN_ROUND1_ORDER=${ISBN_ROUND1_ORDER:-catalog,nhanam,vanLang,thaiHa,ipm,kimDong,azVietnam,omegaPlus,tanViet,alphaBooks,phuongNam,nhanVan,minhLong,dinhTi,bizbooks,googleBooks,openLibrary,loc,dnb,fahasa}
      - ISBN_DISABLED_SOURCES=${ISBN_DISABLED_SOURCES:-}
      - ISBN_PROVIDER_TIMEOUT_SECONDS=${ISBN_PROVIDER_TIMEOUT_SECONDS:-10}
      - ISBN_PROVIDER_RETRIES=${ISBN_PROVIDER_RETRIES:-1}
      - BOOKSTORE_SITEMAP_TTL_SECONDS=${BOOKSTORE_SITEMAP_TTL_SECONDS:-86400}
      - BOOK_SOURCE_MIN_INTERVAL_SECONDS=${BOOK_SOURCE_MIN_INTERVAL_SECONDS:-0.5}
      - BOOK_SOURCE_BLOCK_COOLDOWN_SECONDS=${BOOK_SOURCE_BLOCK_COOLDOWN_SECONDS:-900}
      - ISBN_PERSISTENT_CACHE=${ISBN_PERSISTENT_CACHE:-true}
      - ENABLE_BOOKSTORE_CODE_INDEX=${ENABLE_BOOKSTORE_CODE_INDEX:-true}
      # Làn AI web search (ai_web_search.py): OpenRouter web_search (Exa) + model chỉ đọc trang được trích dẫn
      - ISBN_AI_WEB_MODE=${ISBN_AI_WEB_MODE:-title}
      - ISBN_AI_WEB_MODEL=${ISBN_AI_WEB_MODEL:-qwen/qwen3.7-flash}
      - ISBN_AI_WEB_REASONING_EFFORT=${ISBN_AI_WEB_REASONING_EFFORT:-low}
      - ISBN_AI_WEB_ENGINE=${ISBN_AI_WEB_ENGINE:-exa}
      - ISBN_AI_WEB_DAILY_LIMIT=${ISBN_AI_WEB_DAILY_LIMIT:-50}
      - ISBN_AI_WEB_MONTHLY_LIMIT=${ISBN_AI_WEB_MONTHLY_LIMIT:-900}
      - ISBN_AI_WEB_CACHE_DAYS=${ISBN_AI_WEB_CACHE_DAYS:-7}
      - ISBN_AI_WEB_DEBUG_DIR=${ISBN_AI_WEB_DEBUG_DIR:-}
      - BOOKSTORE_CODE_INDEX_TTL_SECONDS=${BOOKSTORE_CODE_INDEX_TTL_SECONDS:-86400}
      - BOOKSTORE_CODE_INDEX_PAGE_DELAY_SECONDS=${BOOKSTORE_CODE_INDEX_PAGE_DELAY_SECONDS:-1.0}
      - BOOK_MARKETPLACE_TIMEOUT_SECONDS=${BOOK_MARKETPLACE_TIMEOUT_SECONDS:-30}
      - BOOK_LOOKUP_MAX_WEB_RESULTS=${BOOK_LOOKUP_MAX_WEB_RESULTS:-5}
      - BOOK_LOOKUP_USER_AGENT=${BOOK_LOOKUP_USER_AGENT:-SmartBookBot/1.0}
      - ENABLE_FAHA_CLOAKBROWSER=${ENABLE_FAHA_CLOAKBROWSER:-false}
      - BOOK_BROWSER_TIMEOUT_SECONDS=${BOOK_BROWSER_TIMEOUT_SECONDS:-20}
      - FAHASA_BROWSER_HARD_TIMEOUT_SECONDS=${FAHASA_BROWSER_HARD_TIMEOUT_SECONDS:-35}
      - FAHASA_SEARCH_RESPONSE_WAIT_SECONDS=${FAHASA_SEARCH_RESPONSE_WAIT_SECONDS:-8}
      # "Find book by cover photo": local CLIP (CPU) + OpenRouter vision OCR
      - CLIP_MODEL_NAME=${CLIP_MODEL_NAME:-openai/clip-vit-base-patch32}
      - COVER_OCR_MAX_TOKENS=${COVER_OCR_MAX_TOKENS:-200}
      - COVER_OCR_TIMEOUT_SECONDS=${COVER_OCR_TIMEOUT_SECONDS:-20}
      - COVER_SEARCH_VISUAL_THRESHOLD=${COVER_SEARCH_VISUAL_THRESHOLD:-0.80}
      - COVER_SEARCH_MIN_CONFIDENCE=${COVER_SEARCH_MIN_CONFIDENCE:-0.5}
      - COVER_SEARCH_VISUAL_WEIGHT=${COVER_SEARCH_VISUAL_WEIGHT:-0.6}
      - COVER_SEARCH_RESULT_LIMIT=${COVER_SEARCH_RESULT_LIMIT:-5}
      - PACKING_VISION_MAX_TOKENS=${PACKING_VISION_MAX_TOKENS:-200}
      - PACKING_VISION_TIMEOUT_SECONDS=${PACKING_VISION_TIMEOUT_SECONDS:-15}
      - BOOK_OCR_ENABLED=${BOOK_OCR_ENABLED:-true}
      - OPENROUTER_BOOK_OCR_MODEL=${OPENROUTER_BOOK_OCR_MODEL:-qwen/qwen3.7-flash}
      - OPENROUTER_BOOK_OCR_FALLBACK_MODEL=${OPENROUTER_BOOK_OCR_FALLBACK_MODEL:-}
      - BOOK_OCR_FALLBACK_DAILY_BUDGET_USD=${BOOK_OCR_FALLBACK_DAILY_BUDGET_USD:-0.5}
      - BOOK_OCR_MAX_IMAGES=${BOOK_OCR_MAX_IMAGES:-3}
      - BOOK_OCR_MAX_TOKENS=${BOOK_OCR_MAX_TOKENS:-1800}
      - BOOK_OCR_TIMEOUT_SECONDS=${BOOK_OCR_TIMEOUT_SECONDS:-45}
      - BOOK_OCR_MAX_FILE_MB=${BOOK_OCR_MAX_FILE_MB:-8}
      - BOOK_OCR_MAX_TOTAL_MB=${BOOK_OCR_MAX_TOTAL_MB:-8}
      - BOOK_OCR_MAX_IMAGE_EDGE=${BOOK_OCR_MAX_IMAGE_EDGE:-1600}
      - BOOK_OCR_LOOKUP_TIMEOUT_SECONDS=${BOOK_OCR_LOOKUP_TIMEOUT_SECONDS:-35}
      - BOOK_OCR_MAX_CONCURRENCY=${BOOK_OCR_MAX_CONCURRENCY:-2}
      - BOOK_OCR_VISUAL_VERIFICATION_ENABLED=${BOOK_OCR_VISUAL_VERIFICATION_ENABLED:-true}
      - OPENROUTER_BOOK_OCR_VERIFY_MODEL=${OPENROUTER_BOOK_OCR_VERIFY_MODEL-google/gemini-3.1-flash-lite}
      - BOOK_OCR_VERIFY_MAX_TOKENS=${BOOK_OCR_VERIFY_MAX_TOKENS:-6000}
      - BOOK_OCR_VERIFY_DAILY_BUDGET_USD=${BOOK_OCR_VERIFY_DAILY_BUDGET_USD:-0.5}
      - ENABLE_NIGHTLY_BRIEFING=${ENABLE_NIGHTLY_BRIEFING:-true}
      - NIGHTLY_BRIEFING_HOUR_VN=${NIGHTLY_BRIEFING_HOUR_VN:-2}
      - NIGHTLY_BRIEFING_LLM_TIMEOUT_SECONDS=${NIGHTLY_BRIEFING_LLM_TIMEOUT_SECONDS:-180}
    volumes:
      - ai_model_cache:/app/.cache/huggingface
      - ai_cloakbrowser_cache:/app/.cloakbrowser
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        # torch + CLIP (CPU) and a headless Chromium for marketplace lookups
        limits: { cpus: "2", memory: 3g }

  api-gateway:
    <<: *app-defaults
    image: ${API_GATEWAY_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-api-gateway:${IMAGE_TAG:?Set IMAGE_TAG (state/release.env)}}
    networks: [edge, app, data]
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3002
      - INVENTORY_SERVICE_URL=http://inventory-service:3001
      - BORROW_SERVICE_URL=http://borrow-service:3005
      - ANALYTICS_SERVICE_URL=http://analytics-service:3006
      - AI_SERVICE_URL=http://ai-service:8000
      # optional (no depends_on): /monitoring/* answers 503 while it is down
      - MONITORING_SERVICE_URL=http://monitoring-service:3007
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      - ALLOWED_ORIGINS=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - SOCKET_CORS_ORIGIN=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      auth-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      borrow-service: { condition: service_healthy }
      analytics-service: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }

  web:
    image: ${WEB_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-web:${IMAGE_TAG:?Set IMAGE_TAG (state/release.env)}}
    restart: unless-stopped
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # CSP connect-src (apps/web/nginx.conf); the API origins themselves are baked into the bundle at CI build time
      - API_ORIGIN=${PUBLIC_API_ORIGIN:-https://api.smartbook.io.vn}
      - API_WS_ORIGIN=${PUBLIC_API_WS_ORIGIN:-wss://api.smartbook.io.vn}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }
    logging: *default-logging
    networks: [edge]

  caddy:
    image: ${CADDY_IMAGE:-ghcr.io/vinhhung04/smartbook-caddy:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      api-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1", memory: 256m }
    logging: *default-logging
    networks: [edge]


  # ---- Monitoring & alerting -----------------------------------------------
  # Started by deploy.sh AFTER a healthy application rollout and never part of it:
  # none of these failing can stop or roll back a business release. No business
  # service depends on them. Nothing here publishes a port except Grafana on
  # loopback (reach it through an SSH tunnel).

  # Incidents, routing, email/in-app/Slack/Discord delivery (monitoring_db).
  monitoring-service:
    <<: *app-defaults
    image: ${MONITORING_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-monitoring-service:${IMAGE_TAG:?Set IMAGE_TAG (state/release.env)}}
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=postgresql://monitoring_runtime:${MONITORING_DB_PASSWORD:-}@db:5432/monitoring_db?schema=public
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:?Set INTERNAL_SERVICE_KEY in .env}
      # Shared with Grafana and healthcheck.sh (>= 24 chars); the service refuses to start without it.
      - MONITORING_INGEST_TOKEN=${MONITORING_INGEST_TOKEN:-}
      # 64 hex chars: AES-256-GCM key for stored webhook URLs (openssl rand -hex 32).
      - MONITORING_SECRET_KEY=${MONITORING_SECRET_KEY:-}
      - MONITORING_WEBHOOK_ALLOW_PUBLIC=${MONITORING_WEBHOOK_ALLOW_PUBLIC:-false}
      - ALLOWED_ORIGINS=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - PUBLIC_WEB_URL=${PUBLIC_WEB_ORIGIN:-https://smartbook.io.vn}
      - REDIS_URL=redis://redis:6379
      - GATEWAY_URL=http://api-gateway:3000
      - PROMETHEUS_URL=http://prometheus:9090
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${MONITORING_SMTP_FROM:-SmartBook Monitoring <noreply@smartbook.io.vn>}
    volumes:
      # alert payloads received while monitoring_db is down (replayed when it is back)
      - monitoring_spool:/app/spool
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3007/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  prometheus:
    image: prom/prometheus:v2.53.0@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384m }
    logging: *default-logging
  grafana:
    image: grafana/grafana:11.1.0@sha256:079600c9517b678c10cda6006b4487d3174512fd4c6cface37df7822756ed7a5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Expanded by provisioning/alerting/contact-points.yaml (webhook to monitoring-service).
      MONITORING_INGEST_TOKEN: ${MONITORING_INGEST_TOKEN:-}
    # Refuse to start with a missing/short ingest token instead of provisioning a
    # contact point that every delivery would fail against.
    entrypoint:
      - sh
      - -c
      - '[ "$${#MONITORING_INGEST_TOKEN}" -ge 24 ] || { echo "Set MONITORING_INGEST_TOKEN (>= 24 chars) in .env" >&2; exit 1; }; exec /run.sh'
    ports: ["127.0.0.1:3100:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [app, data]
    depends_on: [prometheus]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    logging: *default-logging

  # VPS CPU/RAM/disk. Host PID namespace and a read-only view of / are what the
  # exporter reads; it has no write access and no published port.
  node-exporter:
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    pid: host
    read_only: true
    security_opt: [no-new-privileges:true]
    volumes:
      - /:/host:ro,rslave
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9100/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 64m }
    logging: *default-logging

  # Per-container CPU/memory/OOM. Needs the Docker socket (read-only mount; note
  # that :ro does not restrict Docker API calls - the container is not exposed and
  # runs with no-new-privileges). Only the series the rules use are kept (prometheus.yml).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    restart: unless-stopped
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --store_container_labels=false
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,network,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    security_opt: [no-new-privileges:true]
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.3", memory: 192m }
    logging: *default-logging

  # Connects as monitoring_exporter (pg_monitor only, db-init/05-monitoring-db.sh):
  # cluster statistics only, no read access to business tables.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/monitoring_db?sslmode=disable
      DATA_SOURCE_USER: monitoring_exporter
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD:-}
    read_only: true
    security_opt: [no-new-privileges:true]
    networks: [data]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 64m }
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0@sha256:c5a968ba5f30bab5e12181cceb89c4ed37cb4fe4d85490b5b66c7cfe4750b5e8
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    read_only: true
    security_opt: [no-new-privileges:true]
    networks: [data]
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.1", memory: 32m }
    logging: *default-logging

  # Explicit owner jobs: never part of default application startup.
  migrate-auth:
    profiles: ["operations"]
    image: ${AUTH_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-auth-service:${IMAGE_TAG:?Set IMAGE_TAG}}
    user: "0:0"
    entrypoint: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/auth_db?schema=public
    networks: [data]
  migrate-inventory:
    profiles: ["operations"]
    image: ${INVENTORY_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-inventory-service:${IMAGE_TAG:?Set IMAGE_TAG}}
    user: "0:0"
    entrypoint: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/inventory_db?schema=public
    networks: [data]
  migrate-borrow:
    profiles: ["operations"]
    image: ${BORROW_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-borrow-service:${IMAGE_TAG:?Set IMAGE_TAG}}
    user: "0:0"
    entrypoint: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/borrow_db?schema=public
    networks: [data]
  migrate-monitoring:
    profiles: ["operations"]
    image: ${MONITORING_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-monitoring-service:${IMAGE_TAG:?Set IMAGE_TAG}}
    user: "0:0"
    entrypoint: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/monitoring_db?schema=public
    networks: [data]
  migrate-ai:
    profiles: ["operations"]
    image: ${AI_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-ai-service:${IMAGE_TAG:?Set IMAGE_TAG}}
    entrypoint: ["python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/ai_db
    networks: [data]
  backup-files:
    profiles: ["operations"]
    image: ${INVENTORY_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-inventory-service:${IMAGE_TAG:?Set IMAGE_TAG}}
    user: "0:0"
    network_mode: none
    read_only: true
    volumes:
      - packing_evidence_data:/recovery/packing:ro
      - procurement_document_data:/recovery/procurement:ro
  prepare-volumes:
    profiles: ["operations"]
    image: ${INVENTORY_SERVICE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/vinhhung04}/smartbook-inventory-service:${IMAGE_TAG:?Set IMAGE_TAG}}
    user: "0:0"
    network_mode: none
    entrypoint: ["chown", "--no-dereference", "-R", "-P", "--", "1000:1000", "/recovery/packing", "/recovery/procurement", "/models", "/browser"]
    command: []
    volumes:
      - packing_evidence_data:/recovery/packing
      - procurement_document_data:/recovery/procurement
      - ai_model_cache:/models
      - ai_cloakbrowser_cache:/browser

networks:
  # Caddy <-> web, api-gateway
  edge:
  # application services (needs egress: OpenRouter, SMTP, book lookups)
  app:
  # db, redis, rabbitmq: no internet, unreachable from Caddy/web
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  packing_evidence_data:
  procurement_document_data:
  ai_model_cache:
  ai_cloakbrowser_cache:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  monitoring_spool:
