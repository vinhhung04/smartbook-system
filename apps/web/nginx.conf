# Rendered by the nginx image's envsubst step (see apps/web/Dockerfile). Only ${API_ORIGIN} and
# ${API_WS_ORIGIN} are substituted (NGINX_ENVSUBST_FILTER), so nginx's own $variables are left alone.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${API_ORIGIN} ${API_WS_ORIGIN}; img-src 'self' data: blob: https://*.fahasa.com https://*.tiki.vn https://*.tikicdn.com https://books.google.com https://books.googleusercontent.com https://covers.openlibrary.org https://archive.org https://*.archive.org https://dinhtibooks.com.vn https://bizweb.dktcdn.net https://*.hstatic.net; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # First path segments of the SPA routes in src/app/routes.ts (kept in sync by
  # tests/nginx-routes.test.mjs). These get index.html with 200 as before.
  location ~ ^/(about|account|admin|ai-assistant|ai-import|audit-trail|book|books|borrow|branches|catalog|categories|customer|dashboard|discover|exception-reports|fines|forbidden|forgot-password|inventory|loans|login|membership|membership-plans|movements|my|my-exception-reports|my-purchase-requests|my-warehouse-tasks|new-arrivals|notifications|order-requests|orders|outbound|packing|picking|popular|profile|purchase-orders|purchase-requests|putaway|reading-analytics|receiving-check|receiving-putaway|receiving-smart|recommendations|register|reorder-suggestions|reports|reservations|reset-password|roles|scan-cover|search|shelves|staff-tasks|stock-audits|supplier|supplier-deliveries|suppliers|support|transfer-receiving|users|warehouses|wishlist)(/|$) {
    try_files $uri /index.html;
    expires -1;
  }

  # Any other path that is not a file: still index.html (the app shows its 404 page),
  # but with a real 404 status so search engines drop it instead of reporting a soft 404.
  location / {
    try_files $uri $uri/ =404;
    error_page 404 /index.html;
    expires -1;
  }
}
