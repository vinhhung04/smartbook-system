# Rendered by the nginx image's envsubst step (see apps/web/Dockerfile). Only ${API_ORIGIN} and
# ${API_WS_ORIGIN} are substituted (NGINX_ENVSUBST_FILTER), so nginx's own $variables are left alone.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${API_ORIGIN} ${API_WS_ORIGIN}; img-src 'self' data: blob: https://*.fahasa.com https://*.tiki.vn https://*.vinabook.com https://books.google.com https://books.googleusercontent.com https://covers.openlibrary.org; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
