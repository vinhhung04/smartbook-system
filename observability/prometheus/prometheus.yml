global:
  scrape_interval: 15s

# The Node exporter (packages/shared/telemetry) puts service.name only on
# target_info, so each target gets a service_name label here - the dashboards
# and alerts group and filter by it.
scrape_configs:
  - job_name: node-services
    static_configs:
      - targets: [api-gateway:9464]
        labels: { service_name: api-gateway }
      - targets: [auth-service:9464]
        labels: { service_name: auth-service }
      - targets: [inventory-service:9464]
        labels: { service_name: inventory-service }
      - targets: [borrow-service:9464]
        labels: { service_name: borrow-service }
      - targets: [analytics-service:9464]
        labels: { service_name: analytics-service }
  # Only up with `--profile ai`; without it this target simply shows as down.
  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: [ai-service:8000]
        labels: { service_name: ai-service }
