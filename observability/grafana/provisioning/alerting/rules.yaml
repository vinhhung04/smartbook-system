apiVersion: 1

groups:
  - orgId: 1
    name: smartbook-alerts
    folder: SmartBook
    interval: 1m
    rules:
      - uid: smartbook-error-rate-high
        title: Error rate high
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: (sum(rate(http_server_request_duration_count{http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_count[5m]))) > 0.05
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: HTTP error rate is above 5% over the last 5 minutes.

      - uid: smartbook-outbox-failed
        title: Outbox publish giving up
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: outbox_failed_records > 0
        noDataState: OK
        execErrState: Error
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: An outbox event gave up retrying and is now FAILED.

      - uid: smartbook-reservation-conflict-spike
        title: Reservation conflict rate abnormal
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: sum(rate(reservation_conflict_total[5m])) * 60 > 5
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Reservation conflicts exceed 5/min (demo threshold, not tuned from a real baseline)."

      - uid: smartbook-db-unavailable
        title: Database unavailable
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: db_up == bool 0
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "inventory-service's SELECT 1 healthcheck failed — the database is unreachable (no postgres_exporter installed; /health and Prometheus's own `up` don't touch the DB, so db_up is a dedicated gauge for this)."

      - uid: smartbook-low-stock-critical
        title: Low stock critical
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: inventory_low_stock_variant_count > 0
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: One or more variants are at or below their reorder point.

      - uid: smartbook-backlog-age
        title: Outbox pending age exceeds 5m
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: outbox_oldest_pending_age_seconds > 300
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
          owner_role: operations
        annotations:
          summary: Outbox pending age exceeds 5m
          runbook_url: https://github.com/vinhhung04/smartbook-system/blob/hungg/docs/PRODUCTION_OPERATIONS.md

      - uid: smartbook-manual-reconciliation
        title: Unresolved reconciliation requires review
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: reconciliation_manual_pending > 0
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
          owner_role: operations
        annotations:
          summary: Unresolved reconciliation requires review
          runbook_url: https://github.com/vinhhung04/smartbook-system/blob/hungg/docs/PRODUCTION_OPERATIONS.md

      - uid: smartbook-automatic-reconciliation-age
        title: Automatic reconciliation stuck
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: reconciliation_oldest_automatic_age_seconds > 300
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
          owner_role: operations
        annotations:
          summary: Automatic reconciliation stuck
          runbook_url: https://github.com/vinhhung04/smartbook-system/blob/hungg/docs/PRODUCTION_OPERATIONS.md

      - uid: smartbook-payment-unapplied
        title: Provider money needs allocation or refund
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: payment_unapplied_pending > 0
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
          owner_role: operations
        annotations:
          summary: Provider money needs allocation or refund
          runbook_url: https://github.com/vinhhung04/smartbook-system/blob/hungg/docs/PRODUCTION_OPERATIONS.md

      - uid: smartbook-metrics-unavailable
        title: Service metrics unavailable
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: up == 0
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
          owner_role: operations
        annotations:
          summary: Service metrics unavailable
          runbook_url: https://github.com/vinhhung04/smartbook-system/blob/hungg/docs/PRODUCTION_OPERATIONS.md

      - uid: smartbook-ai-provider-errors
        title: AI provider requests failing
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: sum(rate(ai_llm_calls_total{outcome="error"}[5m])) > 0
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: warning
          owner_role: operations
        annotations:
          summary: AI provider requests failing
          runbook_url: https://github.com/vinhhung04/smartbook-system/blob/hungg/docs/PRODUCTION_OPERATIONS.md

      - uid: smartbook-callback-failure
        title: Payment callback processing failure
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: sum(increase(payment_callback_outcomes_total{outcome="failed"}[5m])) > 0
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: warning
          owner_role: operations
        annotations:
          summary: Payment callback processing failure
          runbook_url: https://github.com/vinhhung04/smartbook-system/blob/hungg/docs/PRODUCTION_OPERATIONS.md

      - uid: smartbook-ai-budget-denied
        title: AI quota or budget storage unavailable
        condition: A
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus-ds
            model:
              refId: A
              instant: true
              expr: sum(increase(ai_budget_admission_total[5m])) > 0
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels:
          severity: warning
          owner_role: operations
        annotations:
          summary: AI quota or budget storage unavailable
          runbook_url: https://github.com/vinhhung04/smartbook-system/blob/hungg/docs/PRODUCTION_OPERATIONS.md
